version: '3.9'

services:
  cmrnext:
    image: cmrnext:latest
    shm_size: 64g
    container_name: cmrnext
    stdin_open: true
    tty: true
    volumes:
      - type: bind
        source: /home/yichen/my_prjs/industry/CMRNext
        target: /root/CMRNext
      - type: bind
        source: /home/$USER/datasets
        target: /root/Datasets
      - /tmp/.X11-unix:/tmp/.X11-unix
    environment:
      - DISPLAY=$DISPLAY
      - QT_X11_NO_MITSHM=1
      - XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    # runtime: nvidia
    network_mode: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]
    command: bash



